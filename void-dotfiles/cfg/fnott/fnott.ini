# =============================================================================== #
# General:                                                                        #
# =============================================================================== #
title-font=JetBrainsMono Nerd Font:pixelsize=12
summary-font=JetBrainsMono Nerd Font:pixelsize=12
body-font=JetBrainsMono Nerd Font:pixelsize=12
anchor=bottom-left
border-radius=1
border-size=1
edge-margin-vertical=2
edge-margin-horizontal=2
notification-margin=4
min-width=300
layer=overlay
icon-theme=Kora
max-icon-size=32
padding-vertical=15
padding-horizontal=15
progress-bar-height=15
max-timeout=10
selection-helper=fuzzel --dmenu
summary-format=<b>%s</b>
title-format=<b>%a%A</b>
title-color=88B497ff
summary-color=DBD2C7ff
body-color=DBD2C7ff
background=172526ff
border-color=233935ff
progress-color=87CBB1ff

# =============================================================================== #
# Profiles:                                                                       #
# =============================================================================== #
# Low: ===========================================================================================
[low]
background=D8464Bff
title-color=88B497ff
summary-color=DBD2C7ff
body-color=DBD2C7ff
progress-color=568270e0
icon=dialog-information

# Normal: ========================================================================================
[normal]
background=172526ff
icon=dialog-information

# Critical: ======================================================================================
[critical]
background=33232Aff
title-color=88B497ff
summary-color=DBD2C7ff
body-color=DBD2C7ff
icon=dialog-warning
