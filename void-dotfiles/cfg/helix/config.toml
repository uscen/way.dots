# =============================================================================== #
# Theme:                                                                          #
# =============================================================================== #
theme = "thorn"

# =============================================================================== #
# Cursor:                                                                         #
# =============================================================================== #
[editor.cursor-shape]
insert                             = "block"
normal                             = "block"
select                             = "block"

# =============================================================================== #
# Picker:                                                                         #
# =============================================================================== #
[editor.file-picker]
hidden                             = true
follow-symlinks                    = true
deduplicate-links                  = true
parents                            = true
ignore                             = true
git-ignore                         = true
git-global                         = true
git-exclude                        = true

# =============================================================================== #
# Gutter:                                                                         #
# =============================================================================== #
[editor.gutters]
layout                             = ["line-numbers","diagnostics","diff"]

