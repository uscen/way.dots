# =============================================================================== #
# Theme:                                                                          #
# =============================================================================== #
theme = "thorn"

# =============================================================================== #
# Editor:                                                                         #
# =============================================================================== #
# General: =======================================================================================
[editor]
mouse = true
cursorline = true
true-color = true
color-modes = true
auto-pairs = true
auto-save = true
auto-info = false
scroll-lines = 1
scrolloff = 99
idle-timeout = 200
completion-timeout = 100
completion-trigger-len = 2
preview-completion-insert = false
default-yank-register = "+"
popup-border = "all"
bufferline = "multiple"
gutters = ["diff", "diagnostics", "line-numbers", "spacer"]
end-of-line-diagnostics = "hint"

# Lsp: ===========================================================================================
[editor.lsp]
auto-signature-help = true
display-messages = true
display-inlay-hints = false

# Diagnostics: ===================================================================================
[editor.inline-diagnostics]
cursor-line = "warning"
other-lines = "error"

# Indentline: ====================================================================================
[editor.indent-guides]
render = false
character = "▏"

# statusline: ====================================================================================
[editor.statusline]
left = ["mode", "spinner", "file-name", "total-line-numbers"]
center = ["version-control"]
right = ["diagnostics", "spacer", "file-encoding", "position", "file-line-ending"]

# =============================================================================== #
# Keymaps:                                                                        #
# =============================================================================== #
# Normal: ========================================================================================
[keys.normal]
esc = ["collapse_selection", "keep_primary_selection", "normal_mode"]
H = "goto_first_nonwhitespace"
L = "goto_line_end"
G = "goto_last_line"
V = ["select_mode", "extend_to_line_bounds"]
D = "kill_to_line_end"
X = ["select_mode", "select_line_above"]
x = ["select_mode", "select_line_below"]
r = "replace_with_yanked"
"%" = ["select_mode", "select_all"]
"ret" = "goto_word"
"C-n" = "search_selection"
"tab" = "goto_next_buffer"
"S-tab" = "goto_previous_buffer"

[keys.normal.space.f]
f = "file_picker"
b = "buffer_picker"
s = "symbol_picker"

# Select: ========================================================================================
[keys.select]
esc = ["collapse_selection", "keep_primary_selection", "normal_mode"]
H = "goto_line_start"
L = "goto_line_end"
G = "goto_last_line"
V = "extend_to_line_bounds"
P = "replace_with_yanked"
X = "select_line_above"
x = "select_line_below"
"C-n" = "search_selection"
